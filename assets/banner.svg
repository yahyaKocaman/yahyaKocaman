<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Yahya Kocaman — machine learning and applied AI">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#080d18"/>
      <stop offset="48%"  stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1d4ed8" stop-opacity="0.34"/>
      <stop offset="45%"  stop-color="#0e7490" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%"   stop-color="#f8fafc"/>
      <stop offset="58%"  stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>

    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="38%"  stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="edgeFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1e40af" stop-opacity="0.10"/>
      <stop offset="50%"  stop-color="#38bdf8" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.10"/>
    </linearGradient>

    <pattern id="mesh" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1e3a5f" stroke-width="0.6" stroke-opacity="0.5"/>
    </pattern>

    <linearGradient id="meshMask" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <mask id="meshFade"><rect width="1200" height="360" fill="url(#meshMask)"/></mask>

    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#67e8f9" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-1.2 0; 1.2 0; -1.2 0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>

    <clipPath id="card"><rect width="1200" height="360" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#canvas)"/>
    <rect width="1200" height="360" fill="url(#mesh)" mask="url(#meshFade)"/>
    <ellipse cx="952" cy="180" rx="330" ry="250" fill="url(#halo)">
      <animate attributeName="rx" values="330;372;330" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="11s" repeatCount="indefinite"/>
    </ellipse>
    <rect width="1200" height="360" fill="url(#scan)"/>

    <g stroke="url(#edgeFade)" stroke-width="0.9" fill="none">
      <path d="M820 96 L950 76"/>   <path d="M820 96 L950 128"/>  <path d="M820 96 L950 180"/>
      <path d="M820 152 L950 76"/>  <path d="M820 152 L950 128"/> <path d="M820 152 L950 180"/> <path d="M820 152 L950 232"/>
      <path d="M820 208 L950 128"/> <path d="M820 208 L950 180"/> <path d="M820 208 L950 232"/> <path d="M820 208 L950 284"/>
      <path d="M820 264 L950 180"/> <path d="M820 264 L950 232"/> <path d="M820 264 L950 284"/>
      <path d="M950 76 L1080 124"/> <path d="M950 76 L1080 180"/>
      <path d="M950 128 L1080 124"/><path d="M950 128 L1080 180"/><path d="M950 128 L1080 236"/>
      <path d="M950 180 L1080 124"/><path d="M950 180 L1080 180"/><path d="M950 180 L1080 236"/>
      <path d="M950 232 L1080 124"/><path d="M950 232 L1080 180"/><path d="M950 232 L1080 236"/>
      <path d="M950 284 L1080 180"/><path d="M950 284 L1080 236"/>
    </g>

    <g fill="#22d3ee">
      <circle cx="820" cy="152" r="2.6">
        <animateMotion dur="3.4s" repeatCount="indefinite" path="M0 0 L130 -24 L260 28"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.8;1" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="820" cy="264" r="2.6">
        <animateMotion dur="3.4s" begin="-1.1s" repeatCount="indefinite" path="M0 0 L130 -32 L260 -28"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.8;1" dur="3.4s" begin="-1.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="820" cy="96" r="2.6" fill="#a5b4fc">
        <animateMotion dur="3.4s" begin="-2.2s" repeatCount="indefinite" path="M0 0 L130 84 L260 28"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.8;1" dur="3.4s" begin="-2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="820" cy="208" r="2.2" fill="#7dd3fc">
        <animateMotion dur="4.6s" begin="-3s" repeatCount="indefinite" path="M0 0 L130 76 L260 28"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.8;1" dur="4.6s" begin="-3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g fill="#0b1220" stroke="#38bdf8" stroke-width="1.4">
      <circle cx="820" cy="96"  r="5"><animate attributeName="stroke-opacity" values="0.35;0.95;0.35" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="152" r="5"><animate attributeName="stroke-opacity" values="0.95;0.35;0.95" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="208" r="5"><animate attributeName="stroke-opacity" values="0.45;0.9;0.45" dur="5.1s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="264" r="5"><animate attributeName="stroke-opacity" values="0.9;0.4;0.9" dur="5.1s" repeatCount="indefinite"/></circle>
    </g>

    <g fill="#0b1220" stroke="#60a5fa" stroke-width="1.4">
      <circle cx="950" cy="76"  r="5.4"><animate attributeName="stroke-opacity" values="0.4;0.95;0.4" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="950" cy="128" r="5.4"><animate attributeName="stroke-opacity" values="0.9;0.4;0.9" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="950" cy="180" r="5.4"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="4.8s" repeatCount="indefinite"/></circle>
      <circle cx="950" cy="232" r="5.4"><animate attributeName="stroke-opacity" values="1;0.45;1" dur="4.8s" repeatCount="indefinite"/></circle>
      <circle cx="950" cy="284" r="5.4"><animate attributeName="stroke-opacity" values="0.5;0.9;0.5" dur="5.6s" repeatCount="indefinite"/></circle>
    </g>

    <g>
      <circle cx="1080" cy="124" r="7" fill="#0b1220" stroke="#67e8f9" stroke-width="1.6"/>
      <circle cx="1080" cy="124" r="7" fill="none" stroke="#67e8f9" stroke-width="1">
        <animate attributeName="r" values="7;20" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1080" cy="180" r="7" fill="#0b1220" stroke="#67e8f9" stroke-width="1.6"/>
      <circle cx="1080" cy="180" r="7" fill="none" stroke="#67e8f9" stroke-width="1">
        <animate attributeName="r" values="7;20" dur="3.4s" begin="-1.15s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0" dur="3.4s" begin="-1.15s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1080" cy="236" r="7" fill="#0b1220" stroke="#67e8f9" stroke-width="1.6"/>
      <circle cx="1080" cy="236" r="7" fill="none" stroke="#67e8f9" stroke-width="1">
        <animate attributeName="r" values="7;20" dur="3.4s" begin="-2.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0" dur="3.4s" begin="-2.3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="88" y="94" width="3" height="34" rx="1.5" fill="#22d3ee"/>

    <text x="106" y="118" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace"
          font-size="13" fill="#5b7a99" letter-spacing="3.4">machine learning · applied ai</text>

    <text x="86" y="196" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif"
          font-size="66" font-weight="600" fill="url(#ink)" letter-spacing="-1.6">Yahya Kocaman</text>

    <text x="88" y="234" font-family="'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif"
          font-size="19" fill="#8fa6bf" letter-spacing="0.3">
      I turn data into models, and models into products.
    </text>

    <rect x="88" y="260" width="188" height="2" rx="1" fill="url(#hair)">
      <animate attributeName="width" values="0;188" dur="1.5s" fill="freeze"/>
    </rect>

    <g font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace"
       font-size="13.5" fill="#54708c" letter-spacing="0.4">
      <text x="88"  y="298">python</text>
      <text x="163" y="298" fill="#1e3a5f">·</text>
      <text x="180" y="298">pytorch</text>
      <text x="266" y="298" fill="#1e3a5f">·</text>
      <text x="283" y="298">tensorflow</text>
      <text x="400" y="298" fill="#1e3a5f">·</text>
      <text x="417" y="298">scikit-learn</text>
      <text x="546" y="298" fill="#1e3a5f">·</text>
      <text x="563" y="298">pandas</text>
    </g>

    <path d="M18 30 V18 H30"  fill="none" stroke="#22d3ee" stroke-width="1.4" stroke-opacity="0.5" stroke-linecap="round"/>
    <path d="M1182 330 V342 H1170" fill="none" stroke="#22d3ee" stroke-width="1.4" stroke-opacity="0.5" stroke-linecap="round"/>

    <rect x="0.5" y="0.5" width="1199" height="359" rx="18" fill="none" stroke="#1c3557" stroke-width="1"/>
  </g>
</svg>
